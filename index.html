<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MF Line Inspection</title>
<meta name="theme-color" content="#0E2233">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{--navy:#0E5A73;--navy2:#0a4458;--acc:#F39C12;--bg:#f2f5f7;--card:#fff;--ink:#14232b;--mut:#5b6b74;--line:#d5dee3;
--ok:#1e8e3e;--bad:#c62828;--na:#6d7b83;--nv:#8e6a00;--s1:#f5c518;--s2:#f08a00;--s3:#d32f2f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
header.top h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:12px;opacity:.85;font-weight:400}
header.top button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:6px 10px;font-size:14px}
main{max-width:860px;margin:0 auto;padding:12px 12px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}
.card h2{font-size:17px;margin:0 0 10px;color:var(--navy)}
.card h3{font-size:15px;margin:14px 0 6px;color:var(--navy)}
.muted{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
label.f{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;padding:10px 11px;border:1px solid #b9c7ce;border-radius:9px;background:#fff;min-height:44px}
textarea{min-height:64px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 16px;border-radius:10px;border:1px solid var(--navy);background:#fff;color:var(--navy);font-weight:600;cursor:pointer}
.btn.pri{background:var(--navy);color:#fff}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#1b1b1b}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 11px;font-size:14px}
.btn[disabled]{opacity:.45}
.list .it{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px}
.list .it .t{font-weight:700;font-size:17px;min-width:58px}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:#e6eef2;color:var(--navy);font-weight:600}
.pill.s1{background:var(--s1);color:#222}.pill.s2{background:var(--s2);color:#fff}.pill.s3{background:var(--s3);color:#fff}
.pill.ok{background:#d9f0df;color:var(--ok)}
.bar{height:6px;background:#e3e9ec;border-radius:4px;overflow:hidden;margin-top:6px}.bar>i{display:block;height:100%;background:var(--ok)}
nav.tabs{position:sticky;top:52px;z-index:15;display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:#e8eef1;border-bottom:1px solid var(--line);scrollbar-width:none}
nav.tabs button{flex:0 0 auto;border:1px solid #b9c7ce;background:#fff;border-radius:20px;padding:7px 12px;font-size:14px;font-weight:600;color:var(--navy);position:relative}
nav.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
nav.tabs button .dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
nav.tabs button .done{color:var(--ok);margin-left:4px}
.item{border-top:1px solid var(--line);padding:11px 0}
.item:first-of-type{border-top:0}
.item .hd{display:flex;gap:8px;align-items:flex-start}
.item .no{font-weight:700;min-width:40px;color:var(--navy)}
.item .nm{font-weight:600}
.item .cr{font-size:13px;color:var(--mut);margin-top:2px}
.app{font-size:11px;font-weight:700;border:1px solid #9fb2bb;border-radius:5px;padding:0 5px;color:var(--mut);margin-left:auto;white-space:nowrap}
.seg{display:flex;gap:6px;margin-top:8px}
.seg button{flex:1;min-height:46px;border:1.5px solid #b9c7ce;background:#fff;border-radius:9px;font-weight:700;font-size:15px}
.seg button.on.Y,.seg button.on.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.on.N,.seg button.on.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button.on.NA{background:var(--na);border-color:var(--na);color:#fff}
.seg button.on.NV{background:var(--nv);border-color:var(--nv);color:#fff}
.seg button.on.s1{background:var(--s1);border-color:var(--s1)}
.seg button.on.s2{background:var(--s2);border-color:var(--s2);color:#fff}
.seg button.on.s3{background:var(--s3);border-color:var(--s3);color:#fff}
.seg button.on.s0{background:var(--ok);border-color:var(--ok);color:#fff}
.seg.small button{min-height:38px;font-size:14px}
.dfx{margin-top:8px;padding:10px;border-radius:10px;background:#fff4f2;border:1px solid #f3c2bb}
.grid4,.grid6{display:grid;gap:6px;margin-top:8px}
.grid4{grid-template-columns:repeat(4,1fr)}.grid6{grid-template-columns:repeat(3,1fr)}
@media(min-width:620px){.grid6{grid-template-columns:repeat(6,1fr)}}
.cell{border:1.5px solid #b9c7ce;border-radius:9px;background:#fff;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;user-select:none}
.cell small{font-size:11px;color:var(--mut);font-weight:600}
.cell .v{font-size:19px}
.cell.ok{background:#e3f4e7;border-color:var(--ok);color:var(--ok)}
.cell.bad{background:#fde8e6;border-color:var(--bad);color:var(--bad)}
.cell.NA{background:#eef1f3;color:var(--na)}
.cell.NV{background:#fff6dc;border-color:var(--nv);color:var(--nv)}
.cell.val{background:#e8f1f5;border-color:var(--navy);color:var(--navy)}
.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.photos{grid-template-columns:repeat(3,1fr)}}
.ph{border:1.5px dashed #9fb2bb;border-radius:10px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.ph.have{border-style:solid;border-color:var(--ok)}
.ph .img{aspect-ratio:4/3;background:#eef2f4 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:30px}
.ph .cap{padding:6px 8px;font-size:12.5px}
.ph .cap b{color:var(--navy)}
.ph .act{display:flex;gap:4px;padding:0 6px 6px}
.ph .act .btn{flex:1;min-height:38px;font-size:13px;padding:4px}
.issues li{margin:3px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1d2b33;color:#fff;padding:11px 16px;border-radius:10px;z-index:99;max-width:92vw;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.sticky-foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;z-index:18}
.sticky-foot .btn{flex:1}
.gps{font-size:12px}
.gps.far{color:var(--bad);font-weight:700}
.kv{display:grid;grid-template-columns:120px 1fr;gap:3px 10px;font-size:14px}
.kv div:nth-child(odd){color:var(--mut)}
.chk{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chk label{display:flex;align-items:center;gap:6px;border:1.5px solid #b9c7ce;border-radius:9px;padding:8px 11px;background:#fff;font-size:14px;min-height:42px}
.chk label.on{border-color:var(--navy);background:#e8f1f5;font-weight:600}
.chk input{display:none}
table.log{width:100%;border-collapse:collapse;font-size:13px}
table.log td,table.log th{border-bottom:1px solid var(--line);padding:5px;text-align:left;vertical-align:top}
.hide{display:none!important}
.drop{border:2px dashed #9fb2bb;border-radius:12px;padding:18px;text-align:center;background:#fafcfd}

#pane.locked{pointer-events:none;opacity:.78}
.it.sel{outline:2px solid var(--navy)}
.hide{display:none!important}

.legend{font-size:13px;margin:4px 0 10px;line-height:1.35}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.38);display:flex;align-items:flex-end;z-index:98}
.sheet-in{background:#fff;width:100%;padding:16px 14px calc(16px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.25)}
.sheet-t{font-weight:700;margin-bottom:6px;color:var(--navy)}
.sheet .seg button{min-height:56px;font-size:16px}
.sheet .seg button.ok{border-color:var(--ok);color:var(--ok)}.sheet .seg button.bad{border-color:var(--bad);color:var(--bad)}
.sheet .seg button.on.ok{background:var(--ok);color:#fff}.sheet .seg button.on.bad{background:var(--bad);color:#fff}
.sheet .seg button.on.NA{background:var(--na);color:#fff}.sheet .seg button.on.NV{background:var(--nv);color:#fff}
.cr b{color:var(--navy)}

:root{--navy:#0E2233;--navy2:#163650;--steel:#3C5A6B;--acc:#F05A28;--bg:#EDF1F4;--card:#fff;--ink:#132430;--mut:#5A6D78;--line:#D3DCE2;
--ok:#138A5A;--bad:#D0342C;--na:#6B7B85;--nv:#9A6B00;--s1:#F2C230;--s2:#EE7F1A;--s3:#D0342C;
--thermal:linear-gradient(90deg,#2B1055 0%,#B0186A 38%,#F05A28 70%,#FFD23F 100%);--disp:"Barlow SC","Roboto Condensed","Arial Narrow",sans-serif}
html,body{background:var(--bg)}
header.top{background:var(--navy);box-shadow:none;border-bottom:3px solid transparent;border-image:var(--thermal) 1}
header.top h1{font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:.2px}
header.top #gear{font-size:18px;padding:4px 10px}
.hide{display:none!important}
.card{border-radius:14px;border-color:var(--line)}
.card h2{font-family:var(--disp);font-weight:600;font-size:20px;color:var(--navy);letter-spacing:.1px}
.btn{border-radius:12px;border-color:var(--navy);color:var(--navy);font-weight:600}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.55);color:#fff}
.btn.wide{width:100%;min-height:54px;font-size:17px;margin-top:12px}
.tabs button.on{background:var(--navy)!important;border-color:var(--navy)!important}
.bar i{background:var(--thermal)!important}
/* landing */
body.landing header.top{display:none}
body.landing main{padding:0;max-width:none}
body.landing{background:var(--navy)}
.hero{position:relative;color:#fff;padding:18px 18px 4px;background:radial-gradient(120% 90% at 70% 10%,#1B4562 0%,#0E2233 62%);overflow:hidden}
.hero .logos{display:flex;justify-content:space-between;align-items:center}
.hero .plate{background:#fff;border-radius:10px;padding:6px 8px;display:inline-flex;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.hero .plate img{height:46px;width:auto;display:block}
.hero .plate.cl img{height:26px}
.hero .art{margin:6px -18px 0}
.hero .art svg{display:block;width:100%;height:auto;max-height:280px}
.hero .art .hot{animation:glow 3.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes glow{0%,100%{opacity:.75;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.hero .art .hot{animation:none}}
.hero .brand{font-family:var(--disp);font-weight:700;font-size:34px;line-height:1.02;margin:4px 0 6px;letter-spacing:.3px}
.hero .tag{margin:0 0 14px;color:#AFC3CF;font-size:15px}
.gate{background:var(--bg);border-radius:22px 22px 0 0;margin-top:-6px;padding:20px 18px 40px;min-height:52vh;max-width:620px;margin-left:auto;margin-right:auto}
.gate h2{font-family:var(--disp);font-weight:600;font-size:22px;margin:4px 0 12px;color:var(--navy)}
.gate .btn.ghost{background:#fff;border-color:var(--navy);color:var(--navy)}
.gate .note{background:#FFF4E5;border-left:4px solid var(--acc);padding:10px 12px;border-radius:8px;margin-bottom:12px}
.people{display:grid;gap:10px}
.person{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.person .pn{display:flex;flex-direction:column}.person small,.who-big small{color:var(--mut);font-size:13px}
.ini{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:18px;color:#fff;background:linear-gradient(135deg,#B0186A,#F05A28);flex:none}
.who-big{display:flex;align-items:center;gap:12px;margin:6px 0 10px}.who-big b{font-size:19px;display:block}
.link{background:none;border:0;color:var(--steel);font-weight:600;padding:4px 0;margin-bottom:6px;cursor:pointer}
input.pin{font-size:26px;letter-spacing:10px;text-align:center;font-family:var(--disp)}
/* dashboard */
.dash{background:radial-gradient(130% 120% at 85% 0%,#1B4562 0%,#0E2233 60%);color:#fff;border-radius:16px;padding:16px 16px 14px;margin-bottom:12px}
.dash .hi{font-weight:600;font-size:15px;color:#DCE6EC}.dash .hi span{display:block;font-size:12px;color:#93AABA;font-weight:500}
.dash .big{display:flex;align-items:flex-end;gap:10px;margin:8px 0 8px}
.dash .big .n{font-family:var(--disp);font-weight:700;font-size:64px;line-height:.85}
.dash .big .of{font-size:14px;color:#B9CAD5;padding-bottom:4px}
.thermo{height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}.thermo i{display:block;height:100%;background:var(--thermal);border-radius:6px}
.dash .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.dash .stats div{background:rgba(255,255,255,.07);border-radius:10px;padding:8px 6px;text-align:center}
.dash .stats b{display:block;font-family:var(--disp);font-size:24px;font-weight:700}.dash .stats span{font-size:11px;color:#A9BCC8}
.dash .stats .w b{color:#FFB25C}.dash .stats .h b{color:#FF7A6E}
.next .nx{display:flex;align-items:center;gap:12px}
.next .lbl{font-size:13px;color:var(--mut)}.next .tw{font-family:var(--disp);font-weight:700;font-size:34px;color:var(--navy);line-height:1}.next .sub2{font-size:13px;color:var(--mut)}
.it .sy{font-size:12px;margin-top:4px}.it .sy.up{color:#B26A00}.it .sy.ok{color:var(--ok)}
.lnk{background:none;border:0;color:var(--steel);text-decoration:underline;font-size:12px;padding:0 0 0 8px;cursor:pointer}
.spc{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--mut);margin-top:6px}
.empty{color:var(--mut);padding:8px 2px}
.ver{text-align:center;color:#9AAAB4;font-size:12px}
/* sheets and dialogs */
.sheet.modal{align-items:center;justify-content:center;padding:18px}
.sheet.modal .sheet-in{border-radius:16px;max-width:420px}
.sheet.modal h3{font-family:var(--disp);font-size:21px;margin:0 0 6px;color:var(--navy)}
.sheet.modal p{margin:0 0 14px;line-height:1.45}
/* review, history, camera No. */
.rvb{border-left:4px solid var(--acc)!important}
.hist .h{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist .tm{min-width:84px;color:var(--mut);font-size:12px}.hist .ch{color:var(--mut);font-size:13px}
input.camno{margin-top:6px;min-height:38px;font-size:14px;padding:6px 9px}
.ph .img.cam{font-size:13px;font-weight:700;color:var(--navy);background:#E6EDF2}
.rvf{background:#FFF8EF;border:1px dashed #E7B37A;border-radius:10px;padding:8px 10px;margin-top:8px}
.rvf label.f{color:#8A4B00}
.rvro{background:#FFF8EF;border-radius:8px;padding:6px 9px;margin-top:6px;font-size:13px}
#pane.locked .rvf{pointer-events:auto;opacity:1}
/* in-app camera */
.cam{position:fixed;inset:0;background:#000;z-index:120;display:flex;flex-direction:column}
.cam video{flex:1;width:100%;height:100%;object-fit:cover;background:#000}
.cam .cbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px calc(18px + env(safe-area-inset-bottom));background:#0E2233}
.cam .cbar .btn{min-width:110px}
.cam .shutter{width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:radial-gradient(circle,#fff 0 56%,transparent 58%);box-shadow:0 0 0 3px rgba(240,90,40,.7)}
.cam.flash video{opacity:.35;transition:opacity .08s}
</style></head>

<script>/* MF-DPC-132 Field App – core engine

  /* ------------------------------------------------------------------ */

  const PHASE_TEXT = { "L1-R": "Line 1, phase R", "L1-Y": "Line 1, phase Y", "L1-B": "Line 1, phase B", "L2-R": "Line 2, phase R", "L2-Y": "Line 2, phase Y", "L2-B": "Line 2, phase B" };
  const SPECIAL_PHASE_ROWS = { "8.8": ["L", "M", "H", "NV", "NA"], "8.24": ["G", "LL", "NV", "NA"] };

  /** Is an item applicable to this tower? App code A/S/T/J/F. */
  function applicable(app, tower, pkg) {
    const g = tower.group;
    if (app === "S") return g === "S";
    if (app === "T") return g === "T";
    if (app === "J") return (pkg.header && pkg.header.opgwJoint) === "Yes";
    return true; // A and F (F decided on site)
  }

  /** Earth severity from the CHK-10 bands (limit is the DPC acceptance limit, default 10 Ω). */
  function earthSev(v, limit) {
    limit = limit || 10;
    if (v === "OL") return 3;
    if (v === "" || v === null || v === undefined || isNaN(+v)) return "";
    v = +v;
    if (v <= limit) return 0;
    if (v <= 2 * limit) return 1;
    if (v <= 5 * limit) return 2;
    return 3;
  }

  function maxDev(r62, r52, r72) {
    const a = +r62, d = [];
    if (!a || isNaN(a)) return "";
    if (r52 !== "" && r52 != null && !isNaN(+r52)) d.push(Math.abs(+r52 - a));
    if (r72 !== "" && r72 != null && !isNaN(+r72)) d.push(Math.abs(+r72 - a));

    return Math.round((Math.max(...d) / a) * 1000) / 10;
  }

  /** Aggregate a leg / phase row into one register value Y/N/NA/NV. */
  function aggregate(vals, sev, special) {
    const v = vals.filter((x) => x !== undefined && x !== null && x !== "");
    if (!v.length) return "";
    if (special) {
      if (v.every((x) => x === "NA")) return "NA";
      if (+sev >= 1) return "N";
      if (v.some((x) => x === "NV")) return "NV";
      return "Y";

    if (v.some((x) => x === "✗")) return "N";
    if (v.every((x) => x === "NA")) return "NA";

  }

  /** Work out row results, defects and counts from a package. */
  function evaluate(pkg, def, tower) {
    if (def && def.generic && API.Forms) return API.Forms.evaluate(pkg, def);

      const photos = Object.keys(pkg.photos || {}).filter((k) => pkg.photos[k] && pkg.photos[k].file);

      const e = (pkg.legs || {})[it.id] || {};

    if (def.earthReadings) earth = earthResults(pkg);

  function earthResults(pkg) {
    const e = pkg.earth || {};
    const lim = +(e.limit || 10);
    const rs = e.rows || [];
    const leads = [0, 1].map((i) => {
      const r = rs[i] || {};
      const v = r.R62 === "OL" ? "OL" : r.R62;
      return { leg: i === 0 ? e.lead1Leg : e.lead2Leg, value: v, sev: earthSev(v, lim), dev: maxDev(r.R62, r.R52, r.R72), tested: v !== "" && v != null, nv: !!r.nv };
    });
    return { limit: lim, leads };
  }

  /** Build defect list from marks; keeps text the inspector already typed. */
  function syncDefects(pkg, def) {
    if (def && def.generic && API.Forms) return API.Forms.syncDefects(pkg, def);
    if (LOGFORMS[pkg.form]) return logDefects(pkg);
    const old = {};
    (pkg.defects || []).forEach((d) => (old[d.key] = d));
    const out = [];
    const push = (key, base) => out.push(Object.assign({ desc: "", photo: "", rec: "" }, old[key] || {}, base, { key }));
    (def.items || []).forEach((it) => {
      const e = (pkg.items || {})[it.id] || {};
      if (e.r === "N" || +e.sev >= 1) push(it.id, { point: it.id, pos: "", component: it.name, sev: e.sev, result: "N" });
    });
    (def.legs || []).forEach((it) => {
      const e = (pkg.legs || {})[it.id] || {};
      LEGS.forEach((l) => { if (e[l] === "✗") push(it.id + "/Leg " + l, { point: it.id, pos: "Leg " + l, component: it.name, sev: e.sev, result: "N" }); });

        return;

    tickMark(tc, on, k) {

  const fmtDate = (iso) => {
    if (!iso) return "";
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
    if (!m) return iso;
    const mon = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][+m[2] - 1];
    return m[3] + "-" + mon + "-" + m[1];
  };
  const num2 = (v) => (v === null || v === undefined || v === "" ? "" : (+v).toFixed(2));

  /**
   * Fill a checklist template.
   * photos: { id: {bytes, ext, w, h} } – image bytes keyed by slot id (V01, P1, D01 …)
   */
  async function fillDocx(templateBytes, def, pkg, tower, photos) {
    const d = await Docx.load(templateBytes);
    const H = def.header;
    const ev = evaluate(pkg, def, tower);
    const h = pkg.header || {};
    const setH = (label, val) => { if (H[label] && val !== undefined && val !== null) d.setText(d.tc(H[label].t, H[label].r, H[label].c), val); };
    const lat = tower.lat != null ? (+tower.lat).toFixed(6) + " N  /  " + (+tower.lon).toFixed(6) + " E" : "";

    // ---- header -----------------------------------------------------
    if (def.id.startsWith("CHK-01")) {
      setH("Tower No.", tower.id);
      setH("Tower type", tower.typeText);
      setH("Applicability group", tower.groupText);
      setH("Body extension", tower.ext);
      setH("Chainage", tower.chainage != null ? num2(tower.chainage) + " m" : "");
      setH("Spans", (tower.prev ? "Back span " + num2(tower.back) + " m to " + tower.prev : "No back span") + "\n" + (tower.next ? "Ahead span " + num2(tower.ahead) + " m to " + tower.next : "No ahead span"));
      setH("GPS Lat / Long", lat);
      setH("Drawings", tower.drawings);
      if (H["Insulator type"]) d.tickLabels(d.tc(H["Insulator type"].t, H["Insulator type"].r, H["Insulator type"].c), h.insulator || []);
      if (H["OPGW joint tower"]) d.tickLabels(d.tc(H["OPGW joint tower"].t, H["OPGW joint tower"].r, H["OPGW joint tower"].c), h.opgwJoint ? [h.opgwJoint] : []);
      setH("Inspection date", fmtDate(h.date));
      setH("Inspection time", [h.timeFrom, h.timeTo].filter(Boolean).join(" – "));
      if (H["Inspection method"]) d.tickLabels(d.tc(H["Inspection method"].t, H["Inspection method"].r, H["Inspection method"].c), h.method || []);
      setH("Weather / visibility", h.weather || "");
      setH("Inspection team", h.team || "");
    } else if (def.id === "CHK-10") {
      setH("Tower No. / type", tower.id + "  /  " + tower.type);
      setH("GPS Lat / Long", lat);
      if (h.instrument) setH("Instrument", h.instrument);
      if (h.serial) setH("Serial No.", h.serial);
      if (h.calDue) setH("Calibration due", fmtDate(h.calDue));
      setH("DPC permit No.", h.permit || "");
      if (H["Soil type"]) d.tickLabels(d.tc(H["Soil type"].t, H["Soil type"].r, H["Soil type"].c), h.soil || []);
      if (H["Soil moisture"]) {
        const c = d.tc(H["Soil moisture"].t, H["Soil moisture"].r, H["Soil moisture"].c);
        d.tickLabels(c, h.moisture || []);
        if (h.lastRain) d.replaceIn(c, "____", String(h.lastRain));
      }
      setH("Test date / time", [fmtDate(h.date), [h.timeFrom, h.timeTo].filter(Boolean).join(" – ")].filter(Boolean).join("  "));
      setH("Weather", h.weather || "");
      setH("Inspection team", h.team || "");
    }

    // ---- item tables --------------------------------------------------
    const defectsByPoint = {};
    (pkg.defects || []).forEach((x) => { (defectsByPoint[x.point] = defectsByPoint[x.point] || []).push(x); });
    for (const it of def.items) {
      const e = (pkg.items || {})[it.id] || {};
      ["Y", "N", "NA", "NV"].forEach((k) => { if (it.col[k] != null) { const bc = d.tc(it.t, it.r, it.col[k]); d.tickMark(bc, e.r === k, k); if (k === "N" && e.r === "N") d.defectCell(bc, e.sev); } });
      if (it.col.Sev != null) { const sc = d.tc(it.t, it.r, it.col.Sev); d.setText(sc, e.sev === 0 || e.sev ? String(e.sev) : ""); d.sevCell(sc, e.sev); }
      const dfs = (defectsByPoint[it.id] || []).filter((x) => !x.pos);
      const ph = [].concat(...dfs.map(photoRefs));
      if (it.col.Photo != null && ph.length) d.setText(d.tc(it.t, it.r, it.col.Photo), [it.photo, ...ph].filter(Boolean).join(" "));
      const rem = [e.rem, ...dfs.map((x) => [defLocation(x), x.desc].filter(Boolean).join(" – "))].filter(Boolean);
      if (it.col.Remarks != null) d.setText(d.tc(it.t, it.r, it.col.Remarks), Array.from(new Set(rem)).join("; "));
    }
    for (const it of def.legs) {
      const e = (pkg.legs || {})[it.id] || {};
      LEGS.forEach((l) => { const c = d.tc(it.t, it.r, it.col["Leg " + l]); d.setText(c, e[l] || ""); d.markText(c, e[l]); if (e[l] === "✗") d.defectCell(c, e.sev); });
      { const sc = d.tc(it.t, it.r, it.col.Sev); d.setText(sc, e.sev === 0 || e.sev ? String(e.sev) : ""); d.sevCell(sc, e.sev); }
    }
    for (const it of def.phases) {
      const e = (pkg.phases || {})[it.id] || {};
      PHASES.forEach((p) => { const c = d.tc(it.t, it.r, it.col[p]); d.setText(c, e[p] || ""); d.markText(c, e[p]); if (e[p] === "✗") d.defectCell(c, e.sev); });
      { const sc = d.tc(it.t, it.r, it.col.Sev); d.setText(sc, e.sev === 0 || e.sev ? String(e.sev) : ""); d.sevCell(sc, e.sev); }
    }
    const posLines = (kind) => (pkg.defects || []).filter((x) => x.pos && (kind === "leg" ? /^Leg /.test(x.pos) : !/^Leg /.test(x.pos) && !/^Lead /.test(x.pos)))
      .map((x) => x.pos + "  " + x.point + " – " + (x.desc || x.component) + (photoRefs(x).length ? " (" + photoRefs(x).join(", ") + ")" : ""));
    if (def.legRemarks) d.setText(d.tc(def.legRemarks.t, 1, 0), [...posLines("leg"), pkg.legRemarks].filter(Boolean).join("\n"));
    if (def.phaseRemarks) d.setText(d.tc(def.phaseRemarks.t, 1, 0), [...posLines("phase"), pkg.phaseRemarks].filter(Boolean).join("\n"));

    // ---- live-line (Option B) -----------------------------------------
    if (def.liveHeader) {
      const L = def.liveHeader, lv = pkg.live || {};
      const cell = (k) => d.tc(L[k].t, L[k].r, L[k].c);
      if (L["Live-line inspection at this tower"]) d.tickLabels(cell("Live-line inspection at this tower"), lv.done ? [lv.done] : []);
      if (L["Circuit energised"]) d.tickLabels(cell("Circuit energised"), lv.energised ? [lv.energised] : []);
      if (L["DPC live-line permit No."]) d.setText(cell("DPC live-line permit No."), lv.permit || "");
      if (L["Live-line method statement"]) d.setText(cell("Live-line method statement"), lv.ms || "");
      if (L["Truck / boom ID"]) d.setText(cell("Truck / boom ID"), lv.truck || "");
      if (L["Dielectric test certificate"] && (lv.dielNo || lv.dielDate)) d.setText(cell("Dielectric test certificate"), "No. " + (lv.dielNo || "") + "  date " + fmtDate(lv.dielDate || ""));
    }
    if (def.liveReadings) {
      const t = def.liveReadings.t;
      def.liveReadings.rows.forEach((p, i) => {
        const r = (pkg.liveReadings || {})[p] || {};
        d.setText(d.tc(t, i + 1, 1), r.insp || "");
        d.setText(d.tc(t, i + 1, 2), r.dT || "");
        d.setText(d.tc(t, i + 1, 3), r.dB || "");
        d.setText(d.tc(t, i + 1, 4), r.sev === 0 || r.sev ? String(r.sev) : "");
        d.setText(d.tc(t, i + 1, 6), r.rem || "");
      });
    }

    // ---- earth readings (CHK-10) ---------------------------------------
    if (def.earthReadings) {
      const t = def.earthReadings.t, e = pkg.earth || {}, er = ev.earth;
      const prev = tower.e2024 || [];
      [0, 1, 2].forEach((i) => {
        const r = (e.rows || [])[i] || {};
        const row = i + 1;
        if (i < 2) {
          const leg = i === 0 ? e.lead1Leg : e.lead2Leg;
          if (leg) d.replaceIn(d.tc(t, row, 0), "____", leg);
        }
        d.setText(d.tc(t, row, 1), r.C || "");
        d.setText(d.tc(t, row, 2), r.P || "");
        d.setText(d.tc(t, row, 3), r.nv ? "NV" : (r.R62 || ""));
        d.setText(d.tc(t, row, 4), r.R52 || "");
        d.setText(d.tc(t, row, 5), r.R72 || "");
        d.setText(d.tc(t, row, 6), maxDev(r.R62, r.R52, r.R72) === "" ? "" : String(maxDev(r.R62, r.R52, r.R72)));
        if (i < 2) {
          d.setText(d.tc(t, row, 7), prev[i] != null ? prev[i] + " Ω – DPC 2024 survey" : "–");
          d.setText(d.tc(t, row, 8), String(er.limit));
          d.setText(d.tc(t, row, 9), er.leads[i].sev === "" ? "" : String(er.leads[i].sev));
        }
      });
    }

    // ---- summary counts --------------------------------------------------
    if (def.summaryCounts) {
      const s = def.summaryCounts;
      let vals;
      if (s.labels[0] === "Leads tested") {
        const L = ev.earth.leads;
        vals = [L.filter((l) => l.tested).length, L.filter((l) => l.sev === 0).length, L.filter((l) => l.sev !== "" && l.sev > 0).length,
          L.filter((l) => !l.tested).length, ev.highest, ev.photos.length];
      } else {
        vals = [ev.counts.checked, ev.counts.Y, ev.counts.N, ev.counts.NA, ev.counts.NV, ev.highest, ev.photos.length];
      }
      vals.forEach((v, i) => d.setText(d.tc(s.t, 1, i), String(v)));
    }

    // ---- field inspection summary ---------------------------------------
    if (def.fieldSummary) {
      const F = def.fieldSummary, s = pkg.summary || {};
      const line = (x) => x.point + (x.pos ? " " + x.pos : "") + " " + x.component + (defLocation(x) ? " (" + defLocation(x) + ")" : "") + " – " + (x.desc || "") + (photoRefs(x).length ? " (" + photoRefs(x).join(", ") + ")" : "");
      const crit = (pkg.defects || []).filter((x) => +x.sev === 3).map((x) => line(x) + (x.notified ? " – DPC informed " + x.notified : s.dpcNotified ? " – DPC informed " + s.dpcNotified : " – DPC to be informed the same day"));
      const maj = (pkg.defects || []).filter((x) => +x.sev === 2).map(line);
      const nv = ev.rows.filter((r) => r.result === "NV").map((r) => r.id + " " + r.name);
      const put = (k, v) => { if (F[k]) d.setText(d.tc(F[k].t, F[k].r, 0), v); };
      put("Observations", s.observations || "");
      put("Critical defects", crit.length ? crit.join("\n") : "None.");
      put("Major defects", maj.length ? maj.join("\n") : "None.");
      put("Open defects from previous rounds", s.openPrevious || "");
      put("Inspection limitations and NV items", [nv.length ? "NV: " + nv.join("; ") : "", s.limitations || ""].filter(Boolean).join("\n") || "None.");
      put("Recommendations to DPC", s.recommendations || "");
      if (F.status) {
        const st = s.status || (nv.length ? "Completed with limitations" : "Completed");
        const c = d.tc(F.status.t, F.status.r, 0);
        const boxes = d.checkboxes(c);
        if (boxes[0]) d.setBox(boxes[0], st === "Completed");
        if (boxes[1]) d.setBox(boxes[1], st !== "Completed");
      }
    }

    // ---- sign-off ---------------------------------------------------------
    if (def.signoff) {
      const so = pkg.signoff || {}, t = def.signoff.t;
      d.setText(d.tc(t, 1, 1), so.inspector || "");
      d.setText(d.tc(t, 1, 2), so.verifier || "");
      d.setText(d.tc(t, 1, 3), so.receiver || "");
      if (so.inspector) d.setText(d.tc(t, 3, 1), fmtDate(so.inspDate || h.date));
      if (so.verifier && so.verDate) d.setText(d.tc(t, 3, 2), fmtDate(so.verDate));
      if (so.receiver && so.recDate) d.setText(d.tc(t, 3, 3), fmtDate(so.recDate));
    }

    // ---- photos -----------------------------------------------------------
    for (const p of def.photos) {
      const ph = photos[p.id];
      if (ph) await d.setPicture(d.tc(p.t, p.r, p.c), ph);
    }
    // defect photos D01 … appended as extra rows of the photo record
    const extra = Object.keys(photos).filter((k) => !def.photos.some((p) => p.id === k)).sort();
    if (extra.length && def.photos.length) {
      const last = def.photos[def.photos.length - 1];
      const tbl = d.tables[last.t];
      const trs = kids(tbl, NS.w, "tr");
      const picRow = trs[trs.length - 2], capRow = trs[trs.length - 1];
      for (let i = 0; i < extra.length; i += 2) {
        const pr = picRow.cloneNode(true), cr = capRow.cloneNode(true);
        desc(cr, NS.w, "bookmarkStart").concat(desc(cr, NS.w, "bookmarkEnd")).forEach((b) => b.parentNode.removeChild(b));
        tbl.appendChild(pr); tbl.appendChild(cr);
        const pcs = kids(pr, NS.w, "tc"), ccs = kids(cr, NS.w, "tc");
        for (let j = 0; j < 2; j++) {
          const id = extra[i + j];
          if (id) {
            await d.setPicture(pcs[j], photos[id]);
            const info = (pkg.photos || {})[id] || {};
            const df = (pkg.defects || []).find((x) => x.photo === id || x.photo2 === id);
            const kind = df ? (df.photo2 === id ? "context" : "close-up") : "";
            const cap = id + " – " + (df ? "Defect " + df.point + (df.pos ? " " + df.pos : "") + " " + kind + " – " + (df.desc || df.component) : (info.caption || "Additional photo"));
            d.setText(ccs[j], cap);
          } else { d.clearPicture(pcs[j]); d.setText(ccs[j], ""); }
        }
      }
    }
    return d.save();
  }

  const colNum = (s) => s.split("").reduce((n, ch) => n * 26 + ch.charCodeAt(0) - 64, 0);

  const splitRef = (ref) => { const m = /^([A-Z]+)(\d+)$/.exec(ref); return [colNum(m[1]), +m[2]]; };
  const excelDate = (iso) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ""); if (!m) return null; return Math.round((Date.UTC(+m[1], +m[2] - 1, +m[3]) - Date.UTC(1899, 11, 30)) / 86400000); };

  class Xlsx {

        t = t.replace(/^\/?xl\//, "");
        x.sheets[s.getAttribute("name")] = "xl/" + t;
      });
      x.shared = [];
      const ss = x.zip.file("xl/sharedStrings.xml");
      if (ss) {
        const sd = parse(await ss.async("string"));
        desc(sd, NS.x, "si").forEach((si) => x.shared.push(desc(si, NS.x, "t").map((t) => t.textContent).join("")));
      }
      x.docs = {};
      return x;
    }
    async sheet(name) {
      if (!this.sheets[name]) throw new Error("Sheet not found: " + name);
      if (!this.docs[name]) {
        const doc = parse(await this.zip.file(this.sheets[name]).async("string"));
        const sd = desc(doc, NS.x, "sheetData")[0];
        const rows = {};
        kids(sd, NS.x, "row").forEach((r) => (rows[+r.getAttribute("r")] = r));
        this.docs[name] = { doc, sd, rows };
      }
      return this.docs[name];
    }
    cellValue(c) {
      if (!c) return "";
      const t = c.getAttribute("t");
      if (t === "inlineStr") return desc(c, NS.x, "t").map((x) => x.textContent).join("");
      const v = kids(c, NS.x, "v")[0];
      if (!v) return "";
      if (t === "s") return this.shared[+v.textContent] || "";
      return v.textContent;
    }
    findCell(sh, ref) {
      const [col, row] = splitRef(ref);
      const r = sh.rows[row];
      if (!r) return null;
      return kids(r, NS.x, "c").find((c) => c.getAttribute("r") === ref) || null;
    }
    async get(name, ref) { const sh = await this.sheet(name); return this.cellValue(this.findCell(sh, ref)); }
    getSync(sh, ref) { return this.cellValue(this.findCell(sh, ref)); }
    ensureCell(sh, ref) {
      const [col, row] = splitRef(ref);
      let r = sh.rows[row];
      if (!r) {
        r = sh.doc.createElementNS(NS.x, "row");
        r.setAttribute("r", row);
        const after = Object.keys(sh.rows).map(Number).filter((n) => n > row).sort((a, b) => a - b)[0];
        sh.sd.insertBefore(r, after ? sh.rows[after] : null);
        sh.rows[row] = r;
      }
      let c = kids(r, NS.x, "c").find((x) => x.getAttribute("r") === ref);
      if (!c) {
        c = sh.doc.createElementNS(NS.x, "c");
        c.setAttribute("r", ref);
        const nxt = kids(r, NS.x, "c").find((x) => splitRef(x.getAttribute("r"))[0] > col);
        // take the style of the cell above when creating a new one
        const above = this.findCell(sh, colLet(col) + (row - 1));
        if (above && above.getAttribute("s")) c.setAttribute("s", above.getAttribute("s"));
        r.insertBefore(c, nxt || null);
      }
      return c;
    }
    /** Write a value; formulas in the target cell are never overwritten. */
    set(sh, ref, value, opts) {
      const c = this.ensureCell(sh, ref);
      if (kids(c, NS.x, "f").length) return false;
      Array.from(c.childNodes).forEach((n) => c.removeChild(n));
      c.removeAttribute("t");
      if (value === null || value === undefined || value === "") return true;
      if (opts && opts.date) { const n = excelDate(value); if (n != null) value = n; }
      if (typeof value === "number" || (opts && opts.number && !isNaN(+value))) {
        const v = sh.doc.createElementNS(NS.x, "v"); v.appendChild(sh.doc.createTextNode(String(+value))); c.appendChild(v);
      } else {
        c.setAttribute("t", "inlineStr");
        const is = sh.doc.createElementNS(NS.x, "is"), t = sh.doc.createElementNS(NS.x, "t");
        t.setAttribute("xml:space", "preserve"); t.appendChild(sh.doc.createTextNode(String(value)));
        is.appendChild(t); c.appendChild(is);
      }
      return true;
    }
    rowOf(sh, colLetter, value, from) {
      for (const n of Object.keys(sh.rows).map(Number).sort((a, b) => a - b)) {
        if (n < (from || 1)) continue;
        if (this.getSync(sh, colLetter + n) === value) return n;
      }
      return null;
    }
    async save() {
      for (const [name, sh] of Object.entries(this.docs)) this.zip.file(this.sheets[name], ser(sh.doc));
      // make Excel recalculate every formula when the file is opened
      const calc = desc(this.wb, NS.x, "calcPr")[0];
      if (calc) calc.setAttribute("fullCalcOnLoad", "1");
      else { const c = this.wb.createElementNS(NS.x, "calcPr"); c.setAttribute("fullCalcOnLoad", "1"); this.wb.documentElement.appendChild(c); }
      this.zip.file("xl/workbook.xml", ser(this.wb));
      return this.zip.generateAsync({ type: "uint8array", compression: "DEFLATE" });
    }
  }

  const REG303 = "Defect Register";
  const RPT_VIS = "1 Visual CHK-01";
  const RPT_EARTH = "5 Earth Tower CHK-10";

  /**
   * Add new defects of a set of packages to REG-303.
   * Returns { bytes, assigned: { pkgIndex: { key: defectId } }, log: [] }
   */
  async function updateReg303(bytes, pkgs, notify) {
    const x = await Xlsx.load(bytes);
    const sh = await x.sheet(REG303);
    const log = [], assigned = {};
    // existing rows
    const existing = [];
    let lastRow = 5;
    for (let r = 6; r <= 505; r++) {
      const id = x.getSync(sh, "A" + r), st = x.getSync(sh, "B" + r);
      if (id || st) { existing.push({ r, id, st, pt: x.getSync(sh, "C" + r), status: x.getSync(sh, "T" + r) }); lastRow = r; }
    }
    pkgs.forEach((pkg, pi) => {
      assigned[pi] = {};
      const prefixR = "D-" + (pkg.round || "2026B") + "-";
      const nowPts = new Set((pkg.defects || []).map((df) => df.pointId || pointPrefix(pkg.form) + "-" + df.point + (df.pos ? "/" + df.pos : "")));
      const myPre = LOGFORMS[pkg.form] ? [LOGFORMS[pkg.form].kind === "night" ? "06-" : LOGFORMS[pkg.form].finding.replace("CHK-", "") + "-"] : [pointPrefix(pkg.form) + "-"];
      existing.filter((e) => e.st === pkg.structure && e.id.startsWith(prefixR) && myPre.some((x) => e.pt.startsWith(x)) && !nowPts.has(e.pt))
        .forEach((e) => log.push(["check", pkg.structure, e.pt, e.id, "in REG-303 but no longer in the field record – review"]));
      const round = pkg.round || "2026B";
      const prefix = "D-" + round + "-";
      (pkg.defects || []).forEach((df) => {
        const pointId = df.pointId || pointPrefix(pkg.form) + "-" + df.point + (df.pos ? "/" + df.pos.replace(/^Leg /, "Leg ") : "");
        // same structure, same point already imported in this round → keep its ID (re-import)
        const same = existing.find((e) => e.st === pkg.structure && e.pt === pointId && e.id.startsWith(prefix));
        const locText = [df.loc || (df.pos ? (PHASE_TEXT[df.pos] || df.pos) : ""), defLocation(df)].filter(Boolean).join("; ");
        const photoText = photoRefs(df).map((p) => photoName(pkg.structure, p).replace(".jpg", "")).concat(df.instr ? [df.instr] : []).join(", ");
        if (same) {
          assigned[pi][df.key] = same.id;
          if (/^[45] /.test(same.status || "")) { log.push(["kept", pkg.structure, pointId, same.id, "closed or cancelled – not changed"]); return; }
          x.set(sh, "E" + same.r, df.desc || df.component); x.set(sh, "F" + same.r, photoText); x.set(sh, "G" + same.r, locText);
          x.set(sh, "I" + same.r, df.sev === "" || df.sev == null ? "" : +df.sev);
          if (df.rec) x.set(sh, "L" + same.r, df.rec);
          log.push(["updated", pkg.structure, pointId, same.id, "Sev " + df.sev]); return;
        }
        const prev = existing.filter((e) => e.st === pkg.structure && e.pt === pointId && !e.id.startsWith(prefix)).pop();
        let seq = 0;
        existing.forEach((e) => { if (e.id.startsWith(prefix)) seq = Math.max(seq, +e.id.slice(prefix.length) || 0); });
        const id = prefix + String(seq + 1).padStart(4, "0");
        const r = lastRow + 1;
        if (r > 505) { log.push(["error", pkg.structure, pointId, "", "REG-303 full (500 rows)"]); return; }
        const posText = locText;
        x.set(sh, "A" + r, id);
        x.set(sh, "B" + r, pkg.structure);
        x.set(sh, "C" + r, pointId);
        x.set(sh, "D" + r, df.component);
        x.set(sh, "E" + r, df.desc || df.component);
        x.set(sh, "F" + r, photoText);
        x.set(sh, "G" + r, posText);
        x.set(sh, "H" + r, "N");
        x.set(sh, "I" + r, df.sev === "" || df.sev == null ? "" : +df.sev);
        x.set(sh, "L" + r, df.rec || "");
        x.set(sh, "U" + r, (pkg.header || {}).date, { date: true });
        x.set(sh, "V" + r, df.source || formCode(pkg.form));
        if (prev) x.set(sh, "W" + r, prev.id);
        existing.push({ r, id, st: pkg.structure, pt: pointId });
        lastRow = r;
        assigned[pi][df.key] = id;
        log.push(["added", pkg.structure, pointId, id, "Sev " + df.sev + (prev ? ", repeat of " + prev.id : "")]);
      });
    });
    // DPC notification recorded by the E&I Engineer (PRO-401 step 7): date, time / person / method / reference, status
    Object.entries(notify || {}).forEach(([id, n]) => {
      const row = existing.find((e) => e.id === id); if (!row || !n || !n.date) return;
      if (x.getSync(sh, "Z" + row.r) === "" ) { x.set(sh, "Z" + row.r, n.date, { date: true }); x.set(sh, "AA" + row.r, n.text || ""); log.push(["notified", row.st, row.pt, id, n.text || ""]); }
      if (!x.getSync(sh, "T" + row.r)) x.set(sh, "T" + row.r, "1 Open – reported to DPC");
    });
    return { bytes: await x.save(), assigned, log };
  }

  /** Update RPT-002 registers 1 (visual) and 5 (tower earth) from packages. */
  async function updateRpt002(bytes, pkgs, defs, towersById, assigned) {
    const x = await Xlsx.load(bytes);
    const log = [];
    const vis = await x.sheet(RPT_VIS);
    // map point id → column from header row 8 ("1.1\nAccess track …")
    const colOf = {};
    const hdr = vis.rows[8];
    kids(hdr, NS.x, "c").forEach((c) => {
      const v = x.cellValue(c);
      const m = /^(\d+\.\d+)\s*\n/.exec(v);
      if (m) colOf[m[1]] = c.getAttribute("r").replace(/\d+$/, "");
      else if (v) colOf["#" + v.split("\n")[0].trim()] = c.getAttribute("r").replace(/\d+$/, "");
    });
    let earth = null;
    try { earth = await x.sheet(RPT_EARTH); } catch (e) { earth = null; }
    for (let pi = 0; pi < pkgs.length; pi++) {
      const pkg = pkgs[pi], def = defs[pkg.form], tw = towersById[pkg.structure] || { group: "T" };
      const ev = evaluate(pkg, def, tw);
      const ids = Object.values((assigned || {})[pi] || {});
      if (pkg.form.startsWith("CHK-01")) {
        const r = x.rowOf(vis, "A", pkg.structure, 9);
        if (!r) { log.push(["error", pkg.structure, "Register 1", "", "structure row not found"]); continue; }
        x.set(vis, "C" + r, (pkg.header || {}).date, { date: true });
        x.set(vis, "D" + r, (pkg.signoff || {}).inspector || (pkg.header || {}).team || "");
        let n = 0;
        ev.rows.forEach((row) => { const col = colOf[row.id]; if (col && row.result) { x.set(vis, col + r, row.result); n++; } });
        const P = (k) => colOf["#" + k];
        if (P("Photo IDs")) x.set(vis, P("Photo IDs") + r, ev.photos.join(" "));
        const obs = (pkg.defects || []).map((d) => d.point + (d.pos ? " " + d.pos : "") + " " + (d.desc || d.component)).join(" · ");
        if (P("Observations – point No. and description")) x.set(vis, P("Observations – point No. and description") + r, [obs, (pkg.summary || {}).observations].filter(Boolean).join(" · "));
        if (P("Visual Sev")) x.set(vis, P("Visual Sev") + r, ev.highest);
        if (P("REG-303 defect IDs")) x.set(vis, P("REG-303 defect IDs") + r, ids.join(" / "));
        if (P("Recommendation to DPC")) x.set(vis, P("Recommendation to DPC") + r, (pkg.summary || {}).recommendations || "");
        log.push(["updated", pkg.structure, "Register 1", "", n + " points, visual Sev " + ev.highest]);
      } else if (pkg.form === "CHK-10" && earth) {
        const r = x.rowOf(earth, "A", pkg.structure, 9);
        if (!r) { log.push(["error", pkg.structure, "Register 5", "", "structure row not found"]); continue; }
        const e = pkg.earth || {}, rs = e.rows || [];
        const val = (row) => (row && row.nv ? "" : row && row.R62 === "OL" ? "OL" : row && row.R62 !== "" && row.R62 != null ? +row.R62 : "");
        x.set(earth, "C" + r, (pkg.header || {}).date, { date: true });
        x.set(earth, "D" + r, e.lead1Leg || "");
        x.set(earth, "E" + r, val(rs[0]));
        x.set(earth, "F" + r, e.lead2Leg || "");
        x.set(earth, "G" + r, val(rs[1]));
        const devs = [maxDev((rs[0] || {}).R62, (rs[0] || {}).R52, (rs[0] || {}).R72), maxDev((rs[1] || {}).R62, (rs[1] || {}).R52, (rs[1] || {}).R72)].filter((v) => v !== "");
        x.set(earth, "H" + r, devs.length ? Math.max(...devs) : "");
        const restored = ((pkg.items || {})["3.1"] || {}).r;
        x.set(earth, "O" + r, restored || "");
        x.set(earth, "P" + r, ev.photos.join(" "));
        const rem = [(pkg.defects || []).map((d) => d.desc).filter(Boolean).join("; "), (pkg.summary || {}).recommendations].filter(Boolean).join(" – ");
        x.set(earth, "Q" + r, rem + (ids.length ? " (REG-303 " + ids.join(", ") + ")" : ""));
        log.push(["updated", pkg.structure, "Register 5", "", "Lead 1 " + val(rs[0]) + " Ω, Lead 2 " + val(rs[1]) + " Ω"]);
      }
    }
    return { bytes: await x.save(), log };
  }

  /** Check a package for missing data before it is closed in the field. */
  function check(pkg, def, tower) {
    if (def && def.generic && API.Forms) return API.Forms.check(pkg, def);
    if (LOGFORMS[pkg.form]) return logCheck(pkg);
    const issues = [];
    const h = pkg.header || {};
    if (!h.date) issues.push("Inspection date missing");
    if (!h.team) issues.push("Inspection team missing");
    const need = (id, name) => { if (!(pkg.items || {})[id] || !(pkg.items[id].r)) issues.push(id + " " + name + " – no result"); };
    (def.items || []).forEach((it) => {
      if (it.id.startsWith("12.") && (pkg.live || {}).done !== "Yes") return;
      need(it.id, it.name);
    });
    (def.legs || []).forEach((it) => { const e = (pkg.legs || {})[it.id] || {}; LEGS.forEach((l) => { if (!e[l]) issues.push(it.id + " Leg " + l + " – no result"); }); });
    (def.phases || []).forEach((it) => { const e = (pkg.phases || {})[it.id] || {}; PHASES.forEach((p) => { if (!e[p]) issues.push(it.id + " " + p + " – no result"); }); });
    (pkg.defects || []).forEach((d) => {
      if (d.sev === "" || d.sev == null || +d.sev < 1) issues.push("Defect " + d.key + " – severity 1–3 needed");
      if (!d.desc) issues.push("Defect " + d.key + " – description needed");
      if (!d.photo && !d.auto) issues.push("Defect " + d.key + " – close-up photo needed");
      if (+d.sev >= 2 && !d.photo2 && !d.auto) issues.push("Defect " + d.key + " – context photo needed (Sev " + d.sev + ")");
      if (STRUCTURAL(pkg.form, d.point) && !d.face && !d.member) issues.push("Defect " + d.key + " – face / member location needed");
    });
    // required standard photos: every slot in the photo record except live-line ones when not done
    (def.photos || []).forEach((p) => {
      if (/^LL/.test(p.id) && (pkg.live || {}).done !== "Yes") return;
      if (p.id === "V10" && tower && !tower.light && ((pkg.items || {})["7.1"] || {}).r === "NA") return;
      if (!(pkg.photos || {})[p.id]) issues.push("Photo " + p.id + " – " + p.caption + " – not taken");
    });
    if (def.earthReadings) {
      const rs = (pkg.earth || {}).rows || [];
      [0, 1].forEach((i) => { const r = rs[i] || {}; if (!r.nv && (r.R62 === "" || r.R62 == null)) issues.push("Lead " + (i + 1) + " – R at 62 % not entered"); });
    }
    return issues;
  }

  /** Minimal .xlsx writer for the log (inline strings, bold header, frozen first row). */
  async function makeXlsx(sheets) {
    const z = new JSZip();
    const x = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const col = (n) => { let s = ""; n++; while (n) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
    z.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`);
    z.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`);
    z.file("xl/workbook.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s, i) => `<sheet name="${x(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("")}</sheets></workbook>`);
    z.file("xl/_rels/workbook.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("")}<Relationship Id="rIdS" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`);
    z.file("xl/styles.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="10"/><name val="Arial"/></font><font><b/><sz val="10"/><color rgb="FFFFFFFF"/><name val="Arial"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF0E5A73"/></patternFill></fill></fills><borders count="2"><border/><border><left style="thin"><color rgb="FFB9C7CE"/></left><right style="thin"><color rgb="FFB9C7CE"/></right><top style="thin"><color rgb="FFB9C7CE"/></top><bottom style="thin"><color rgb="FFB9C7CE"/></bottom></border></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="3"><xf/><xf fontId="1" fillId="2" borderId="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment wrapText="1" vertical="center"/></xf><xf borderId="1" applyBorder="1" applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf></cellXfs></styleSheet>`);
    sheets.forEach((s, i) => {
      const rows = s.rows.map((r, ri) => `<row r="${ri + 1}">${r.map((v, ci) => {
        const ref = col(ci) + (ri + 1), st = ri === 0 ? 1 : 2;
        if (v === "" || v == null) return `<c r="${ref}" s="${st}"/>`;
        if (typeof v === "number") return `<c r="${ref}" s="${st}"><v>${v}</v></c>`;
        return `<c r="${ref}" s="${st}" t="inlineStr"><is><t xml:space="preserve">${x(v)}</t></is></c>`;
      }).join("")}</row>`).join("");
      const cols = s.widths ? `<cols>${s.widths.map((w, ci) => `<col min="${ci + 1}" max="${ci + 1}" width="${w}" customWidth="1"/>`).join("")}</cols>` : "";
      z.file(`xl/worksheets/sheet${i + 1}.xml`, `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>${cols}<sheetData>${rows}</sheetData>${s.rows.length > 1 ? `<autoFilter ref="A1:${col(s.rows[0].length - 1)}${s.rows.length}"/>` : ""}</worksheet>`);
    });
    return z.generateAsync({ type: "uint8array", compression: "DEFLATE" });
  }

  // Word → PDF for every checklist in the folder (needs Microsoft Word on the PC)
  const PDF_VBS = `' MF-DPC-132 - make a PDF of every Word checklist in this folder and its sub-folders, using Microsoft Word.
' A PDF is only remade when the Word file is newer than it.
Set fso = CreateObject("Scripting.FileSystemObject")
here = fso.GetParentFolderName(WScript.ScriptFullName)
Set word = CreateObject("Word.Application")
word.Visible = False
n = 0
Sub Walk(folder)
  For Each f In folder.Files
    If LCase(fso.GetExtensionName(f.Name)) = "docx" And Left(f.Name, 2) <> "~$" Then
      pdf = Left(f.Path, Len(f.Path) - 5) & ".pdf"
      doIt = True
      If fso.FileExists(pdf) Then
        If fso.GetFile(pdf).DateLastModified >= f.DateLastModified Then doIt = False
      End If
      If doIt Then
        Set d = word.Documents.Open(f.Path, False, True)
        d.Fields.Update
        d.ExportAsFixedFormat pdf, 17
        d.Close False
        n = n + 1
      End If
    End If
  Next
  For Each s In folder.SubFolders
    Walk s
  Next
End Sub
Walk fso.GetFolder(here)
word.Quit
MsgBox n & " PDF file(s) made under " & here, 64, "MF-DPC-132"
`.replace(/\n/g, "\r\n");

  /* ================================================================== */
  /* Line logs: CHK-02 thermography, CHK-04 corona / PD, CHK-06 night    */
  /* One package per structure per activity; the engine rebuilds the     */
  /* round-wide Word log and one finding sheet (CHK-03 / CHK-05) per     */
  /* finding of Sev 1 – 3.                                                */
  /* ================================================================== */

  /** Camera inside the app: the phone never leaves the page, so Android cannot close it while a photo is taken. */

      document.body.appendChild(sh);

      const stop = () => { try { stream && stream.getTracks().forEach((t) => t.stop()); } catch (e) {} };

      sh.querySelector("[data-x]").onclick = () => done(null);

      navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 4032 }, height: { ideal: 3024 } }, audio: false })
        .then((st) => { stream = st; if (over) return stop(); sh.querySelector("video").srcObject = st; })
        .catch(() => { toast("Camera blocked – use Phone camera, or allow the camera for this app"); });

  async function capture(slot, caption, src) {
    if (cur.status === "complete") { toast("Completed – reopen it to change anything"); return false; }
    if (cur.heldBy) { toast("Continued by another team member – this copy is read-only"); return false; }
    const file = await (src === "gallery" ? pickImage(false) : inAppCamera()); if (!file) return false;
    const when = new Date();
    const buf = await file.arrayBuffer(), sha = await T.sha256(buf);
    // the same picture cannot stand for two photo slots
    const dupe = Object.entries(cur.photos).find(([k, v]) => k !== slot && v && v.sha === sha);
    if (dupe) { alert("This is the same picture as " + dupe[0] + ". Take a new photo for " + slot + "."); return false; }

    if (ageMin > 30) { const r = prompt("This photo was taken " + new Date(file.lastModified).toLocaleString() + ", not now.\nUse it anyway? Give the reason:"); if (!r || !r.trim()) return false; why.push(r.trim()); }
    const dist = towerDist(structOf(cur.form, cur.structure));

    cur.photos[slot] = { file: Core.photoName(cur.structure, slot), w, h, size: orig.size, origName: file.name, time: when.toISOString(),

  /* ================================================================== */

  const hinKind = (x) => (x.kind === "boxes" ? "boxes" : x.kind === "blank" ? "blank" : /time/i.test(x.label) && !/date/i.test(x.label) ? "time" : /date|calibration due/i.test(x.label) && !/\(s\)/.test(x.label) ? "date" : "text");
  function newGeneric(form, id) {
    const def = DEFS[form], a = structOf(form, id) || {};
    const p = { id: id + "_" + form + "_" + settings.round + "_" + Date.now().toString(36), schema: 2, app: "MF-DPC-132 Field App", appVersion: APP_VERSION,
      form, formRev: def.rev || "", round: settings.round, structure: id, created: new Date().toISOString(), updated: new Date().toISOString(), status: "open",
      header: { date: today(), timeFrom: nowHM(), timeTo: "", team: settings.inspectors }, hin: {}, items: {}, pos: {}, grid: {}, photos: {}, defects: [], summary: {},
      signoff: { inspector: me ? me.name : "", verifier: settings.verifier }, auto: {} };
    def.headerInputs.forEach((x) => {
      if ((a.header || {})[x.label] !== undefined) return; // filled from the item list
      const k = hinKind(x);
      if (/team/i.test(x.label)) p.hin[x.label] = settings.inspectors && !/MF Inspector \d/.test(settings.inspectors) ? settings.inspectors : me ? me.name : "";
      else if (k === "date" && !/due|cert/i.test(x.label)) p.hin[x.label] = today();
      else if (/^Test date\(s\)$/.test(x.label)) p.hin[x.label] = today();
      else if (k === "time") p.hin[x.label] = nowHM();
      else if (/calibration due/i.test(x.label) && settings.calDue) p.hin[x.label] = settings.calDue;
      else if (/earth tester|^instrument$/i.test(x.label)) p.hin[x.label] = settings.instrument + (/S\/N/.test(x.label) ? " / " + settings.serial : "");
      else if (/^serial/i.test(x.label)) p.hin[x.label] = settings.serial;
    });
    genHeaderSync(p);
    return p;
  }
  /** The common header fields the engine, logs and notices read (date, team, time) follow the form's own fields. */
  function genHeaderSync(p) {
    const def = DEFS[p.form]; if (!def) return;
    const h = p.hin || {}, L = def.headerInputs.map((x) => x.label);
    const dl = L.find((l) => /date/i.test(l) && !/due|cert/i.test(l)), tl = L.find((l) => /team/i.test(l)), ml = L.find((l) => /time/i.test(l) && !/date/i.test(l));
    if (dl && h[dl]) p.header.date = String(h[dl]).slice(0, 10);
    if (tl && h[tl] !== undefined) p.header.team = h[tl];
    if (ml && h[ml]) p.header.timeFrom = h[ml];

  const secNo = (s) => String(s || "").split(".")[0].trim();

    [...def.items, ...def.positions].forEach((it) => { const n = secNo(it.id); if (n && !secs.includes(n)) secs.push(n); });
    secs.forEach((n) => t.push(["s" + n, /^\d+$/.test(n) ? "Sec " + n : n.slice(0, 14)]));
    def.grids.forEach((g, gi) => t.push(["g" + gi, titleCase(g.title).slice(0, 22)]));
    t.push(["ph", "Photos"], ["def", "Defects"], ["sum", "Summary"]); if (isLead()) t.push(["hist", "History"]); t.push(["gen", "Finish"]);
    return t;

  function logFinish(pane, L, issues) {

      ${tw.next ? `<div class="row" style="margin-top:8px"><button class="btn acc grow" id="lNext" ${issues.length ? "disabled" : ""}>Complete and go to ${esc(tw.next)} ›</button></div>` : ""}
      <div class="row" style="margin-top:8px"><button class="btn warn sm" id="lDel">Delete this record</button></div></div>`;
    const done = async () => { completeRecord(); await dbPut("insp", cur); syncNow(false); };
    $("#lDone").onclick = async () => { await done(); toast(cur.structure + " complete"); home(); };
    if ($("#lNext")) $("#lNext").onclick = async () => { const form = cur.form, nx = tw.next; await done(); const p = stampNew(await newLogRow(form, nx), "", true); await dbPut("insp", p); toast(nx + " started"); openInsp(p.id); };
    $("#lDel").onclick = async () => { if (!confirm("Delete this record and its photos from the tablet?")) return; for (const k of Object.keys(cur.photos)) await dbDel("photos", cur.id + "/" + k); await dbDel("insp", cur.id); home(); };

  /* ------------------------------ upload queue ------------------------------ */
  // Order per inspection: photos first, then the package, so the engine and the Sev 3 e-mail find the photos.
  let syncing = false, syncTimer = null, lastSync = null, lastErr = "";
  function markDirty() { if (!cur) return; if (cur.status === "complete" || cur.heldBy) return; audit(); cur.rev = (cur.rev || 0) + 1; cur.updated = new Date().toISOString(); clearTimeout(saveTimer); { const c = cur; saveTimer = setTimeout(() => c && dbPut("insp", c), 250); }; queueSync(); }
  function queueSync() { clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow(false), 4000); }
  const folderOf = (p) => p.structure + "_" + Core.formCode(p.form);
  async function pendingCount(p) {
    if (p.heldBy) return 0;
    let n = (p.sentRev || 0) < (p.rev || 0) ? 1 : 0;
    for (const k of Object.keys(p.photos || {})) { const r = await dbGet("photos", p.id + "/" + k); if (r && !r.uploaded) n++; }
    return n;
  }
  async function post(body) {
    const r = await fetch(settings.endpoint, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "upload refused");
    return j;
  }
  const toB64 = (blob) => new Promise((res) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.readAsDataURL(blob); });
  /** Who sends a record: the last person who worked on it, if their key is on this phone, else the person signed in. */
  const uploaderFor = (p) => (people[p.lastUser] && people[p.lastUser].secret ? people[p.lastUser] : me && me.secret ? me : Object.values(people).find((x) => x.secret) || null);
  const refused = (e) => /ACCESS WITHDRAWN|Wrong personal key|Unknown person/.test(e.message || "");
  async function syncNow(loud) {
    if (syncing) return; if (!settings.endpoint || !Object.keys(people).length) { if (loud) toast("Set the upload address in Settings and sign in."); updateSyncBadge(); return; }
    if (!navigator.onLine) { if (loud) toast("No signal – will send automatically later."); updateSyncBadge(); return; }
    syncing = true; updateSyncBadge();
    let sent = 0, who = null;
    try {
      const all = await dbAll("insp");
      for (const p of all) {
        who = uploaderFor(p); if (!who || p.heldBy) continue;
        try {
        for (const k of Object.keys(p.photos || {})) {
          const key = p.id + "/" + k, r = await dbGet("photos", key);
          if (!r || r.uploaded || !r.orig) continue;
          const j = await post({ action: "photo", user: who.id, auth: who.secret, round: p.round, folder: folderOf(p), name: Core.photoName(p.structure, k), mime: r.orig.type || "image/jpeg", b64: await toB64(r.orig), device: settings.device || "" });
          clockFrom(j.time);
          r.uploaded = new Date().toISOString();
          if (settings.freeSpace) delete r.orig; // original is safe in Drive; keep the thumbnail only
          await dbPut("photos", r, key); sent++;
        }
        if ((p.sentRev || 0) < (p.rev || 0) || !p.sentRev) {
          const def = DEFS[p.form], tw = TW[p.structure] || { group: "T" };
          Core.syncDefects(p, def);
          const ev = Core.evaluate(p, def, tw);
          const summary = Object.assign({}, ev.counts, { highest: ev.highest, open: Core.check(p, def, tw).length, distance: Math.max(0, ...Object.values(p.photos || {}).map((x) => x.dist || 0)) });
          const rev = p.rev || 0;
          // sign every open change and seal the record with the sender's key
          p.clock = { skewMin: clockSkew, device: settings.device || "", at: new Date().toISOString() };
          await T.signAndSeal(p, secrets(), { id: who.id, device: settings.device || "" });
          const j = await post({ action: "package", user: who.id, auth: who.secret, round: p.round, folder: folderOf(p), pkg: p, summary });
          clockFrom(j.time);
          // keep the signatures on this phone (only where the entry is still exactly what was signed)
          const keepSigs = (q) => (q.audit || []).forEach((e, i) => { const sgn = (p.audit || [])[i]; if (sgn && sgn.s && !e.s && T.entryText(e) === T.entryText(sgn)) e.s = sgn.s; });
          const fresh = await dbGet("insp", p.id); keepSigs(fresh); fresh.sentRev = Math.max(fresh.sentRev || 0, rev || 1); fresh.sentAt = new Date().toISOString();
          await dbPut("insp", fresh); if (cur && cur.id === p.id) { keepSigs(cur); cur.sentRev = fresh.sentRev; cur.sentAt = fresh.sentAt; }
          if (j.alerts) toast("Sev 3 alert sent to the E&I Engineer");
          sent++;
        }
        } catch (e) {
          if (!/^HELD BY/.test(e.message || "")) throw e;
          const fresh = await dbGet("insp", p.id); fresh.heldBy = e.message.replace(/^HELD BY\s*/, ""); await dbPut("insp", fresh);
          if (cur && cur.id === p.id) { cur.heldBy = fresh.heldBy; if (view === "insp") refreshTabs(); }
          toast(p.structure + " is now being continued by " + fresh.heldBy.split(" –")[0] + " – your copy is read-only", 6000);
        }
      }
      lastSync = new Date(); lastErr = "";
      if (loud) toast(sent ? sent + " item(s) sent" : "Everything already sent");
    } catch (e) {
      lastErr = e.message;
      if (refused(e) && who) { syncing = false; await withdrawn(who.id, who.name + ": " + e.message); }
      else if (loud) toast("Send failed: " + e.message + " – will retry");
    }
    finally { syncing = false; updateSyncBadge(); }
  }
  async function updateSyncBadge() {
    const el = $("#sync"); if (!el) return;
    let n = 0; for (const p of await dbAll("insp")) n += await pendingCount(p);
    const off = !navigator.onLine || /fetch|network|Load failed/i.test(lastErr);
    el.textContent = syncing ? "↑ sending…" : off && n ? "📴 " + n + " held" : n ? "↑ " + n + " waiting" : settings.endpoint ? "✓ sent" : "not linked";
    el.title = off ? "No signal – kept on this phone" : lastErr ? "Last error: " + lastErr : lastSync ? "Last sent " + lastSync.toTimeString().slice(0, 5) : "";
    el.style.background = lastErr && !off ? "#c62828" : n ? "#F39C12" : "transparent";
  }

  /* ------------------------------ E&I review results ------------------------------ */
  function reviewOf(p) { const r = ((config && config.reviews) || {})[p.structure + "_" + Core.formCode(p.form)]; return r && r.time > (p.reviewSeen || "") ? r : r; }
  function reviewPill(p) {
    const r = reviewOf(p); if (!r) return "";
    if (r.status === "verified") return '<span class="pill ok">Verified</span>';
    if (r.status === "returned" && !(p.sentAt && p.sentAt > r.time)) return '<span class="pill s3">Returned – open it</span>';
    return "";
  }
  function reviewBanner(p) {
    const r = reviewOf(p); if (!r || r.status !== "returned" || (p.sentAt && p.sentAt > r.time)) return "";
    return `<div class="card" style="border:2px solid #c62828;background:#fff4f2"><h2 style="color:#c62828">Returned by the E&amp;I Engineer</h2><p>${esc(r.note)}</p><p class="muted">${esc(r.by || "")} · ${esc((r.time || "").replace("T", " ").slice(0, 16))}. Correct it, then press "Tower complete – send" again.</p></div>`;
  }

  /* ------------------------------ config from the office ------------------------------ */
  let config = null;
  async function loadConfig() {
    config = await dbGet("kv", "config");
    applyConfig();
    const u = me && me.secret ? me : Object.values(people).find((x) => x.secret);
    if (!settings.endpoint || !u || !navigator.onLine) return;
    try {
      const r = await fetch(settings.endpoint + (settings.endpoint.includes("?") ? "&" : "?") + "action=config&user=" + encodeURIComponent(u.id) + "&auth=" + encodeURIComponent(u.secret));
      const j = await r.json();
      if (!j.ok && refused({ message: j.error })) return withdrawn(u.id, u.name + ": " + j.error);
      clockFrom(j.time);
      if (j.person && people[j.person.id]) { const pp = people[j.person.id]; if (pp.name !== j.person.name || pp.role !== j.person.role) { pp.name = j.person.name; pp.role = j.person.role; savePeople(); } }
      if (j.ok && j.config) { config = j.config; await dbPut("kv", config, "config"); applyConfig(); }
    } catch (e) { /* offline – keep the cached copy */ }
  }
  function applyConfig() {
    if (!config) return;
    if (config.towers && config.towers.length) { TOWERS.length = 0; config.towers.forEach((t) => TOWERS.push(t)); Object.keys(TW).forEach((k) => delete TW[k]); TOWERS.forEach((t) => (TW[t.id] = t)); }
    if (config.round) settings.round = config.round;
    if (config.option) settings.option = config.option;
    if (config.earthLimit) settings.earthLimit = config.earthLimit;
    if (config.permit && !settings.permit) settings.permit = config.permit;
    if (config.forms) Object.assign(DEFS, config.forms);
    if (config.registry) REGISTRY = config.registry;
    if (config.assets) ASSETS = config.assets;
  }

  /* ------------------------------ backup export ------------------------------ */
  async function exportPackages(list) {
    toast("Building backup file…", 4000);
    const zip = new JSZip();
    for (const p of list) {
      const base = Core.formCode(p.form) === p.form ? folderOf(p) + "/" : folderOf(p) + "/";
      zip.file(base + "package.json", JSON.stringify(p, null, 1));
      for (const k of Object.keys(p.photos || {})) {
        const r = await dbGet("photos", p.id + "/" + k);
        if (r && r.orig) zip.file(base + "photos/" + Core.photoName(p.structure, k), new Uint8Array(await r.orig.arrayBuffer()));
      }
    }
    const bytes = await zip.generateAsync({ type: "uint8array" });
    const name = list.length === 1 ? pkgBase(list[0]) + ".zip" : "DPC132_Field_" + settings.round + "_" + today() + "_" + list.length + "-inspections.zip";
    await shareOrDownload(bytes, name, "application/zip");
  }

  }

    setInterval(() => loadConfig().then(() => { if (view === "home") home(); }), 300000);
    await loadConfig();
    locked = true; signInView(); updateSyncBadge(); syncNow(false);
  }
  window.addEventListener("load", start);
})();
</script>
